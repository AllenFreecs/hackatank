<section>
  <h1>Knowledge</h1>
  <mat-card class="search-card">
    <mat-form-field appearance="outline" class="query">
      <mat-label>Ask a question about company knowledge...</mat-label>
      <input matInput [(ngModel)]="query" (keyup.enter)="ask()" />
    </mat-form-field>
    <button mat-flat-button color="primary" (click)="ask()">Search</button>
    @if (answer) {
      <p>{{ answer }}</p>
      <p><strong>Source:</strong> {{ source }}</p>
    }
  </mat-card>

  <mat-card>
    <table mat-table [dataSource]="documents">
      <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Document</th><td mat-cell *matCellDef="let row">{{ row.name }}</td></ng-container>
      <ng-container matColumnDef="category"><th mat-header-cell *matHeaderCellDef>Category</th><td mat-cell *matCellDef="let row">{{ row.category }}</td></ng-container>
      <ng-container matColumnDef="updatedDate"><th mat-header-cell *matHeaderCellDef>Updated</th><td mat-cell *matCellDef="let row">{{ row.updatedDate }}</td></ng-container>
      <ng-container matColumnDef="relevance"><th mat-header-cell *matHeaderCellDef>Relevance</th><td mat-cell *matCellDef="let row">{{ row.relevance }}%</td></ng-container>
      <ng-container matColumnDef="open"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let row"><button mat-button>Open</button></td></ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card>
</section>
