<section>
  <div class="header">
    <h1>Automations</h1>
    <button mat-flat-button color="primary" (click)="createAutomation()">Create Automation</button>
  </div>

  <div class="cards">
    @for (item of automations; track item.id) {
      <mat-card class="wtw-panel automation-card">
        <h3>{{ item.name }}</h3>
        <p><span class="meta-label">Status:</span> <strong>{{ item.status }}</strong></p>
        <p><span class="meta-label">Trigger:</span> {{ item.trigger }}</p>
        <p><span class="meta-label">Action:</span> {{ item.action }}</p>
        <div class="actions">
          <button mat-button (click)="editAutomation(item.id)">Edit</button>
          <button mat-button (click)="runNow(item.name)">Run Now</button>
          <button mat-button (click)="disable(item.id)">Disable</button>
        </div>
      </mat-card>
    }
  </div>
</section>
