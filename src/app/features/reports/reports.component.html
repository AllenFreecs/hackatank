<section>
  <h1>Reports</h1>
  <mat-card>
    <table mat-table [dataSource]="reports">
      <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Report</th><td mat-cell *matCellDef="let report">{{ report.name }}</td></ng-container>
      <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let report">{{ report.status }}</td></ng-container>
      <ng-container matColumnDef="lastGenerated"><th mat-header-cell *matHeaderCellDef>Last generated</th><td mat-cell *matCellDef="let report">{{ report.lastGenerated }}</td></ng-container>
      <ng-container matColumnDef="owner"><th mat-header-cell *matHeaderCellDef>Owner</th><td mat-cell *matCellDef="let report">{{ report.owner }}</td></ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let report">
          <button mat-button (click)="generate(report.id)">Generate</button>
          <button mat-button (click)="view(report.name)">View</button>
          <button mat-button (click)="download(report.name)">Download Excel</button>
          @if (loadingId === report.id) {
            <app-loading-state message="Generating..." />
          }
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card>
</section>
